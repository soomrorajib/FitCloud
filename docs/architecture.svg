<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="900" height="640" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">FitCloud - Cloud Architecture</text>
  <rect x="350" y="55" width="200" height="50" rx="12" fill="#0b1220"/><text x="450" y="86" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">USER (Browser)</text>
  <line x1="450" y1="105" x2="450" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="462" y="127" font-size="12" fill="#475569">HTTPS</text>
  <rect x="300" y="142" width="300" height="62" rx="12" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/><text x="450" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">React Frontend (Vite)</text><text x="450" y="190" text-anchor="middle" font-size="12" fill="#1e3a8a">Vercel / Netlify / S3 + CloudFront</text>
  <line x1="450" y1="204" x2="450" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="462" y="230" font-size="12" fill="#475569">REST API / JSON + JWT</text>
  <rect x="150" y="246" width="600" height="250" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">AWS EC2: Nginx + PM2 + Node.js / Express (MVC)</text>
  <g font-size="13" font-weight="600" fill="#064e3b" text-anchor="middle">
    <rect x="175" y="292" width="120" height="44" rx="8" fill="#fff" stroke="#10b981"/><text x="235" y="319">Routes</text>
    <rect x="310" y="292" width="120" height="44" rx="8" fill="#fff" stroke="#10b981"/><text x="370" y="319">Middleware</text>
    <rect x="445" y="292" width="120" height="44" rx="8" fill="#fff" stroke="#10b981"/><text x="505" y="319">Controllers</text>
    <rect x="580" y="292" width="140" height="44" rx="8" fill="#fff" stroke="#10b981"/><text x="650" y="319">Models (Mongoose)</text>
    <rect x="175" y="360" width="200" height="44" rx="8" fill="#fff" stroke="#10b981"/><text x="275" y="387">Services (s3, report)</text>
    <rect x="395" y="360" width="325" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="557" y="387">Worker Threads (reportWorker.js)</text>
    <text x="450" y="440" font-weight="500" font-size="12" fill="#065f46">Auth (JWT + bcrypt) · Helmet · CORS · Rate limit · Validation · Error middleware</text>
    <text x="450" y="470" font-weight="500" font-size="12" fill="#065f46">Each user can only read and change their own records (userId filter)</text>
  </g>
  <line x1="300" y1="496" x2="230" y2="548" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="496" x2="670" y2="548" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="100" y="550" width="260" height="70" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="230" y="580" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">MongoDB Atlas</text><text x="230" y="602" text-anchor="middle" font-size="12" fill="#713f12">users, workouts, diets, exercises, progresses, contactmessages</text>
  <rect x="540" y="550" width="260" height="70" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="670" y="580" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">AWS S3</text><text x="670" y="602" text-anchor="middle" font-size="12" fill="#7c2d12">profile-images/ (image files only)</text>
</svg>
